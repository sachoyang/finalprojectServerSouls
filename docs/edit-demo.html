<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>편집 데모 v2 — 자유 섹션 그리드</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --void:#f3ede1; --char:#e8dfcd; --char-2:#ddd0b6; --ink:#241d14; --ink-dim:#5c5140;
    --gold:#92661f; --gold-bright:#b98426; --ember:#7a2c1e;
    --line:rgba(36,29,20,0.18); --shadow:rgba(36,29,20,0.18);
    --font-kr:-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;
    --font-mono:ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --void:#120e0b; --char:#1c1712; --char-2:#271f17; --ink:#ece3d2; --ink-dim:#a99c86;
      --gold:#c99a4c; --gold-bright:#e8bd72; --ember:#c65a3f;
      --line:rgba(201,154,76,0.22); --shadow:rgba(0,0,0,0.5);
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--void); color:var(--ink); font-family:var(--font-kr); display:flex; flex-direction:column; min-height:100%; }

  /* ---------- top bar ---------- */
  .bar { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; padding:0.6rem 1rem; border-bottom:1px solid var(--line); background:var(--char); }
  .bar .title { font-family:var(--font-mono); font-size:0.78rem; letter-spacing:0.06em; color:var(--gold); margin-right:0.4rem; }
  .bar .grp { display:flex; align-items:center; gap:0.3rem; padding:0 0.5rem; border-left:1px solid var(--line); }
  .bar .grp:first-of-type { border-left:none; }
  .bar .lbl { font-family:var(--font-mono); font-size:0.66rem; color:var(--ink-dim); }
  .bar .spacer { flex:1; }
  .bar .hint { font-size:0.72rem; color:var(--ink-dim); flex-basis:100%; }
  .btn { font-family:var(--font-mono); font-size:0.72rem; cursor:pointer; border:1px solid var(--line); background:var(--char-2); color:var(--ink); padding:0.4rem 0.7rem; border-radius:4px; }
  .btn:hover { border-color:var(--gold); color:var(--gold-bright); }
  .btn.mini { padding:0.25rem 0.55rem; }
  .btn[aria-pressed="true"] { background:var(--gold); color:var(--void); border-color:var(--gold); }
  body:not(.edit) .edit-only { display:none !important; }

  /* ---------- board ---------- */
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:1.2rem; overflow:auto; }
  .board {
    position:relative; width:min(900px, 96vw); aspect-ratio:16/10;
    display:grid; gap:0.6rem;
    border:1px solid var(--line); border-radius:8px; padding:0.6rem; background:var(--char);
  }
  /* editing grid guide */
  body.edit .board { background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-position:0.6rem 0.6rem; }
  /* preview: filled 블록만 그룹 가운데로 */
  body:not(.edit) .board { align-content:center; justify-content:center; }

  .cell { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:6px; background:var(--char-2); display:flex; flex-direction:column; min-width:0; min-height:0; }
  body.edit .cell { border-style:dashed; border-color:var(--gold); }
  /* 미리보기에서 빈 섹션 숨김 → 남은 섹션이 board의 align/justify-content:center 로 가운데 정렬됨 */
  body:not(.edit) .cell.empty { display:none; }
  body:not(.edit) .cell { border-color:var(--line); }

  .cell-tools { display:none; align-items:center; gap:0.25rem; padding:0.22rem 0.32rem; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--gold) 12%, var(--char)); font-family:var(--font-mono); font-size:0.6rem; }
  body.edit .cell-tools { display:flex; }
  .cell-tools .grip { cursor:grab; color:var(--gold); padding:0 0.15rem; user-select:none; touch-action:none; }
  .cell-tools .tbtn { border:1px solid var(--line); background:var(--void); color:var(--ink-dim); border-radius:3px; padding:0.08rem 0.35rem; cursor:pointer; font-family:inherit; font-size:0.6rem; }
  .cell-tools .tbtn[aria-pressed="true"] { background:var(--gold); color:var(--void); border-color:var(--gold); }
  .cell-tools .sz { color:var(--ink-dim); }
  .cell-tools .del { margin-left:auto; color:var(--ember); border:1px solid var(--line); background:var(--void); border-radius:3px; padding:0.08rem 0.35rem; cursor:pointer; font-family:inherit; }

  .cell-body { flex:1; min-height:0; display:flex; }

  .txt { flex:1; padding:0.6rem 0.8rem; overflow:auto; outline:none; font-size:0.92rem; line-height:1.5; color:var(--ink); display:flex; flex-direction:column; }
  .txt.mid { justify-content:center; }
  .txt.ctr { text-align:center; }
  body.edit .txt { cursor:text; }
  .txt:empty::before { content:"글 입력…"; color:var(--ink-dim); }

  .img-wrap { flex:1; display:flex; align-items:center; justify-content:center; position:relative; background:var(--char); min-height:0; }
  .img-wrap img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; }
  .img-wrap.cover img { width:100%; height:100%; object-fit:cover; }
  .img-empty { display:flex; flex-direction:column; align-items:center; gap:0.35rem; color:var(--ink-dim); font-size:0.76rem; text-align:center; padding:0.9rem; }
  .img-empty .pi { font-size:1.5rem; }
  .img-empty button { font-family:var(--font-mono); font-size:0.64rem; cursor:pointer; border:1px solid var(--line); background:var(--void); color:var(--ink); padding:0.28rem 0.55rem; border-radius:3px; }
  .fit-toggle { position:absolute; right:0.3rem; bottom:0.3rem; display:none; font-family:var(--font-mono); font-size:0.58rem; cursor:pointer; border:1px solid var(--line); background:color-mix(in srgb,var(--void) 85%,transparent); color:var(--ink); padding:0.12rem 0.38rem; border-radius:3px; }
  body.edit .cell.filled .fit-toggle { display:inline-block; }
  .tall-badge { position:absolute; left:0.3rem; top:0.3rem; font-family:var(--font-mono); font-size:0.55rem; color:var(--void); background:var(--gold); padding:0.08rem 0.35rem; border-radius:3px; display:none; }
  body.edit .cell.tall .tall-badge { display:inline-block; }

  .resize { display:none; position:absolute; right:0; bottom:0; width:20px; height:20px; cursor:nwse-resize; z-index:5; touch-action:none;
    background:linear-gradient(135deg, transparent 0 46%, var(--gold) 46% 56%, transparent 56% 68%, var(--gold) 68% 80%, transparent 80%); }
  body.edit .resize { display:block; }

  .cell.dragging { opacity:0.55; outline:2px solid var(--gold-bright); z-index:20; }
  .cell.drop-target { outline:2px dashed var(--gold-bright); outline-offset:-3px; }
</style>
</head>
<body class="edit">

<div class="bar">
  <span class="title">편집 데모 v2</span>

  <span class="grp edit-only">
    <span class="lbl">열</span>
    <button type="button" class="btn mini" data-col="-1">−</button><span class="lbl" id="colN">2</span><button type="button" class="btn mini" data-col="1">+</button>
    <span class="lbl">행</span>
    <button type="button" class="btn mini" data-row="-1">−</button><span class="lbl" id="rowN">3</span><button type="button" class="btn mini" data-row="1">+</button>
  </span>

  <span class="grp edit-only">
    <button type="button" class="btn" id="addBtn">＋ 섹션</button>
    <button type="button" class="btn" id="centerBtn">⌖ 중앙 정렬</button>
  </span>

  <span class="spacer"></span>
  <button type="button" class="btn" id="resetBtn">↺ 초기화</button>
  <button type="button" class="btn" id="editBtn" aria-pressed="true">✏️ 편집 모드</button>

  <span class="hint">그립(⠿) 드래그=위치 이동(빈칸=이동/섹션 위=교환) · 우하단 손잡이=크기 조절 · [글]/[그림] 종류 선택 · 세로로 긴 사진은 자동 감지 → 우측 세로 확장 추천</span>
</div>

<div class="stage">
  <div class="board" id="board"></div>
</div>

<script>
(function () {
  "use strict";
  var board = document.getElementById("board");
  var COLS = 2, ROWS = 3;

  var defaults = [
    { id:"c1", col:1, row:1, cs:1, rs:1, type:"text", text:"<b>왼쪽 섹션 1</b><br>제목/설명 칸", mid:true },
    { id:"c2", col:1, row:2, cs:1, rs:1, type:"text", text:"왼쪽 섹션 2 — 요점" },
    { id:"c3", col:1, row:3, cs:1, rs:1, type:"text", text:"왼쪽 섹션 3" },
    { id:"c4", col:2, row:1, cs:1, rs:1, type:"image" },
    { id:"c5", col:2, row:2, cs:1, rs:1, type:"image" },
    { id:"c6", col:2, row:3, cs:1, rs:1, type:"image" }
  ];
  var cells = clone(defaults);
  var uid = 100;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function isEdit(){ return document.body.classList.contains("edit"); }
  function isFilled(c){ return c.type === "image" ? !!c.src : !!(c.text && c.text.replace(/<[^>]*>/g,"").trim()); }

  // ---- occupancy / validity ----
  function occupies(c){ var s={}; for(var x=c.col;x<c.col+c.cs;x++) for(var y=c.row;y<c.row+c.rs;y++) s[x+","+y]=true; return s; }
  function overlaps(a,b){ return a.col<b.col+b.cs && b.col<a.col+a.cs && a.row<b.row+b.rs && b.row<a.row+a.rs; }
  function valid(cand, ignoreId){
    if (cand.col<1 || cand.row<1) return false;
    if (cand.col+cand.cs-1>COLS || cand.row+cand.rs-1>ROWS) return false;
    for (var i=0;i<cells.length;i++){ if(cells[i].id===ignoreId) continue; if(overlaps(cand,cells[i])) return false; }
    return true;
  }
  function firstFree(){
    for (var y=1;y<=ROWS;y++) for (var x=1;x<=COLS;x++){
      var cand={col:x,row:y,cs:1,rs:1};
      if (valid(cand,null)) return {col:x,row:y};
    }
    return null;
  }

  // ---- render ----
  function render(){
    board.style.gridTemplateColumns = "repeat("+COLS+", 1fr)";
    board.style.gridTemplateRows = "repeat("+ROWS+", 1fr)";
    board.style.backgroundSize = "calc((100% - 1.2rem)/"+COLS+") calc((100% - 1.2rem)/"+ROWS+")";
    document.getElementById("colN").textContent = COLS;
    document.getElementById("rowN").textContent = ROWS;
    board.innerHTML = "";

    cells.forEach(function(c){
      var filled = isFilled(c);
      var el = document.createElement("div");
      el.className = "cell" + (filled ? " filled" : " empty") + (c.tall ? " tall" : "");
      el.dataset.id = c.id;
      el.style.gridColumn = c.col + " / span " + c.cs;
      el.style.gridRow = c.row + " / span " + c.rs;

      var tools = document.createElement("div");
      tools.className = "cell-tools";
      tools.innerHTML =
        '<span class="grip" title="드래그로 이동">⠿</span>' +
        '<button type="button" class="tbtn t-text"'+(c.type==="text"?' aria-pressed="true"':'')+'>글</button>' +
        '<button type="button" class="tbtn t-img"'+(c.type==="image"?' aria-pressed="true"':'')+'>그림</button>' +
        (c.type==="text"?'<button type="button" class="tbtn t-mid" title="세로 가운데"'+(c.mid?' aria-pressed="true"':'')+'>↕</button>':'') +
        '<span class="sz">'+c.cs+'×'+c.rs+'</span>' +
        '<button type="button" class="del" title="섹션 삭제">✕</button>';
      el.appendChild(tools);

      var bodyEl = document.createElement("div");
      bodyEl.className = "cell-body";
      if (c.type==="text"){
        var t = document.createElement("div");
        t.className = "txt" + (c.mid?" mid":"") + (c.ctr?" ctr":"");
        t.contentEditable = isEdit() ? "true":"false";
        t.innerHTML = c.text || "";
        t.addEventListener("input", function(){ c.text = t.innerHTML; el.classList.toggle("empty", !isFilled(c)); el.classList.toggle("filled", isFilled(c)); });
        bodyEl.appendChild(t);
      } else {
        var wrap = document.createElement("div");
        wrap.className = "img-wrap" + (c.fit==="cover"?" cover":"");
        wrap.innerHTML = '<span class="tall-badge">세로 긴 사진</span>';
        if (c.src){
          var img=document.createElement("img"); img.src=c.src; wrap.appendChild(img);
          var fit=document.createElement("button"); fit.type="button"; fit.className="fit-toggle";
          fit.textContent = c.fit==="cover"?"꽉 채움":"전체 보기";
          fit.addEventListener("click", function(e){ e.stopPropagation(); c.fit=c.fit==="cover"?"contain":"cover"; render(); });
          wrap.appendChild(fit);
        } else {
          var empty=document.createElement("div"); empty.className="img-empty";
          empty.innerHTML='<span class="pi">🖼️</span><span>이미지를 넣어주세요</span>';
          var pick=document.createElement("button"); pick.type="button"; pick.textContent="이미지 선택";
          pick.addEventListener("click", function(e){ e.stopPropagation(); openPicker(c); });
          empty.appendChild(pick); wrap.appendChild(empty);
        }
        wrap.addEventListener("dblclick", function(){ if(isEdit()) openPicker(c); });
        bodyEl.appendChild(wrap);
      }
      el.appendChild(bodyEl);

      var rs=document.createElement("div"); rs.className="resize"; el.appendChild(rs);

      tools.querySelector(".t-text").addEventListener("click", function(){ c.type="text"; render(); });
      tools.querySelector(".t-img").addEventListener("click", function(){ c.type="image"; render(); });
      var midBtn = tools.querySelector(".t-mid");
      if (midBtn) midBtn.addEventListener("click", function(){ c.mid=!c.mid; render(); });
      tools.querySelector(".del").addEventListener("click", function(){ cells = cells.filter(function(x){return x.id!==c.id;}); render(); });

      wireDrag(el, c, tools.querySelector(".grip"));
      wireResize(el, c, rs);
      board.appendChild(el);
    });
  }

  // ---- image picker + 긴 사진 자동 처리 ----
  function openPicker(c){
    var input=document.createElement("input"); input.type="file"; input.accept="image/*";
    input.addEventListener("change", function(){
      var f=input.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(e){
        c.type="image"; c.src=e.target.result;
        var probe=new Image();
        probe.onload=function(){
          var ratio = probe.naturalHeight / probe.naturalWidth;
          c.tall = ratio > 1.3;      // 세로로 긴 사진 감지
          if (c.tall){
            c.fit = "contain";        // 잘림 없이 전체 보기
            growTall(c);              // 우측 열에서 세로로 최대한 확장 시도
          } else {
            c.fit = c.fit || "contain";
          }
          render();
        };
        probe.src = c.src;
      };
      r.readAsDataURL(f);
    });
    input.click();
  }
  // 세로로 긴 사진: 현재 위치에서 아래로 가능한 만큼 rowSpan 확장(겹치지 않는 선에서)
  function growTall(c){
    var maxRs = 1;
    for (var rs=ROWS-c.row+1; rs>=1; rs--){
      if (valid({col:c.col,row:c.row,cs:c.cs,rs:rs}, c.id)){ maxRs=rs; break; }
    }
    c.rs = Math.max(c.rs, maxRs);
  }

  // ---- drag move (empty=move, occupied=swap) ----
  function wireDrag(el,c,grip){
    grip.addEventListener("pointerdown", function(e){
      if(!isEdit()) return; e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      grip.style.cursor="grabbing"; el.classList.add("dragging");
      var last=null;
      function under(x,y){
        var r=board.getBoundingClientRect();
        var col=Math.floor((x-r.left)/(r.width/COLS))+1, row=Math.floor((y-r.top)/(r.height/ROWS))+1;
        col=Math.max(1,Math.min(COLS,col)); row=Math.max(1,Math.min(ROWS,row));
        for(var i=0;i<cells.length;i++){ if(occupies(cells[i])[col+","+row]) return {target:cells[i],col:col,row:row}; }
        return {target:null,col:col,row:row};
      }
      function move(ev){
        var h=under(ev.clientX,ev.clientY);
        if(last) last.classList.remove("drop-target");
        if(h.target && h.target.id!==c.id){ var te=board.querySelector('[data-id="'+h.target.id+'"]'); if(te){te.classList.add("drop-target"); last=te;} }
        else last=null;
      }
      function up(ev){
        window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
        grip.style.cursor="grab"; el.classList.remove("dragging"); if(last) last.classList.remove("drop-target");
        var h=under(ev.clientX,ev.clientY);
        if(h.target && h.target.id!==c.id){ swap(c,h.target); }
        else if(!h.target){ var cand={col:h.col,row:h.row,cs:c.cs,rs:c.rs}; if(valid(cand,c.id)){ c.col=h.col; c.row=h.row; } }
        render();
      }
      window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
    });
  }
  function swap(a,b){
    var ac=a.col,ar=a.row,bc=b.col,br=b.row;
    a.col=bc; a.row=br; b.col=ac; b.row=ar;
    if(!valid(a,b.id)||!valid(b,a.id)||overlaps(a,b)){ a.cs=a.rs=1; b.cs=b.rs=1; }
  }

  // ---- resize (snap to grid units) ----
  function wireResize(el,c,handle){
    handle.addEventListener("pointerdown", function(e){
      if(!isEdit()) return; e.preventDefault(); e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      function apply(ev){
        var r=board.getBoundingClientRect(), colW=r.width/COLS, rowH=r.height/ROWS;
        var newCs=Math.round((ev.clientX-r.left)/colW)-(c.col-1);
        var newRs=Math.round((ev.clientY-r.top)/rowH)-(c.row-1);
        newCs=Math.max(1,Math.min(COLS-c.col+1,newCs));
        newRs=Math.max(1,Math.min(ROWS-c.row+1,newRs));
        if(valid({col:c.col,row:c.row,cs:newCs,rs:newRs},c.id)){ c.cs=newCs; c.rs=newRs; render(); }
      }
      function up(){ window.removeEventListener("pointermove",apply); window.removeEventListener("pointerup",up); }
      window.addEventListener("pointermove",apply); window.addEventListener("pointerup",up);
    });
  }

  // ---- 중앙 정렬: 채워진 섹션 그룹을 보드 가운데로 이동 ----
  function centerGroup(){
    var f=cells.filter(isFilled); if(!f.length) return;
    var minC=Math.min.apply(null,f.map(function(c){return c.col;}));
    var maxC=Math.max.apply(null,f.map(function(c){return c.col+c.cs-1;}));
    var minR=Math.min.apply(null,f.map(function(c){return c.row;}));
    var maxR=Math.max.apply(null,f.map(function(c){return c.row+c.rs-1;}));
    var offC=Math.floor((COLS-(maxC-minC+1))/2)-(minC-1);
    var offR=Math.floor((ROWS-(maxR-minR+1))/2)-(minR-1);
    f.forEach(function(c){ c.col+=offC; c.row+=offR; });
    render();
  }

  // ---- bar controls ----
  document.querySelectorAll("[data-col]").forEach(function(b){ b.addEventListener("click", function(){
    var n=COLS+parseInt(b.dataset.col,10); if(n<1||n>4) return;
    if(n<COLS){ for(var i=0;i<cells.length;i++) if(cells[i].col+cells[i].cs-1>n) return; } // 잘리는 섹션 있으면 막기
    COLS=n; render();
  }); });
  document.querySelectorAll("[data-row]").forEach(function(b){ b.addEventListener("click", function(){
    var n=ROWS+parseInt(b.dataset.row,10); if(n<1||n>5) return;
    if(n<ROWS){ for(var i=0;i<cells.length;i++) if(cells[i].row+cells[i].rs-1>n) return; }
    ROWS=n; render();
  }); });
  document.getElementById("addBtn").addEventListener("click", function(){
    var slot=firstFree(); if(!slot){ alert("빈 칸이 없어요. 열/행을 늘리거나 섹션을 지워주세요."); return; }
    cells.push({ id:"c"+(uid++), col:slot.col, row:slot.row, cs:1, rs:1, type:"text", text:"" });
    render();
  });
  document.getElementById("centerBtn").addEventListener("click", centerGroup);

  document.getElementById("editBtn").addEventListener("click", function(){
    var on=!isEdit(); document.body.classList.toggle("edit",on);
    this.setAttribute("aria-pressed",String(on));
    this.textContent = on ? "✅ 편집 중":"✏️ 편집 모드";
    if (!on) centerGroup();   // 발표(미리보기)로 나갈 때: 빈 섹션 접고 채워진 섹션 자동 중앙 정렬
    else render();
  });
  document.getElementById("resetBtn").addEventListener("click", function(){ COLS=2; ROWS=3; cells=clone(defaults); render(); });

  render();
})();
</script>
</body>
</html>
